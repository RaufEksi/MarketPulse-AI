apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketpulse-api
  labels:
    app: marketpulse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketpulse-api
  template:
    metadata:
      labels:
        app: marketpulse-api
    spec:
      containers:
      - name: api
        image: marketpulse-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
