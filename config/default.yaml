# MarketPulse AI - Default Configuration
app:
  name: "MarketPulse AI"
  version: "1.0.0"
  environment: "development"
  log_level: "INFO"
  seed: 42

data:
  symbols: ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "TSLA"]
  bar_timeframe: "5Min"
  lookback_bars: 78 # 1 full trading day of 5-min bars (6.5 hrs * 12 bars)
  prediction_horizon_bars: 6 # 30 minutes ahead
  volatility_threshold_pct: 0.15 # 15% ATR increase threshold for spike class
  decay_lambda_per_hour: 0.5 # Exponential decay rate for text signals
  storage_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  # Reddit text comes from the Arctic Shift archive API (no key needed; Reddit
  # closed self-service API app creation in Nov 2025).
  reddit_api_base_url: "https://arctic-shift.photon-reddit.com"
  reddit_subreddits: ["wallstreetbets", "stocks", "investing"]
  reddit_request_timeout_s: 15.0
  reddit_use_synthetic: false # true = offline synthetic posts instead of API calls
  # Arctic Shift refuses keyword search on busy subreddits (HTTP 422), so posts are
  # scanned and tickers matched locally. Raise this for wider date ranges.
  reddit_max_posts_scanned: 1000 # newest posts scanned per subreddit per call
  reddit_comment_threads: 10 # most-discussed matching posts whose comments are fetched
  reddit_comments_per_thread: 100

nlp:
  finbert_model: "ProsusAI/finbert"
  max_length: 512
  embedding_dim: 768
  batch_size: 32
  device: "cuda" # or "cpu"

model:
  time_series:
    input_dim: 16 # OHLCV + technical indicators
    hidden_dim: 128
    num_layers: 2
    dropout: 0.2
    bidirectional: true
    model_type: "bilstm" # "bilstm" or "tcn"
  text_nlp:
    input_dim: 768 # FinBERT embedding size
    projected_dim: 128
    dropout: 0.2
  fusion:
    embed_dim: 128
    num_heads: 4
    dense_dim: 64
    dropout: 0.3
    num_classes: 2 # Binary classification (0: normal, 1: volatility spike)
  checkpoint_path: "models/marketpulse_net.pt" # Written by scripts/train_model.py, loaded by the API

training:
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 50
  early_stopping_patience: 7
  loss_type: "focal" # "focal" or "weighted_bce"
  focal_gamma: 2.0
  focal_alpha: 0.75
  val_split: 0.15
  test_split: 0.15

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 2

dashboard:
  host: "0.0.0.0"
  port: 8501
  theme: "dark"
  api_base_url: "http://localhost:8000" # overridden by MARKETPULSE_API_URL env var
  api_timeout_seconds: 120.0 # /predict and /explain may load FinBERT on first call
  cache_ttl_seconds: 60
  bars_limit: 78
  texts_limit: 20
